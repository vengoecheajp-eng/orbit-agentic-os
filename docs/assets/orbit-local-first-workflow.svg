<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Orbit local-first workflow</title>
  <desc id="description">A request passes through Orbit, an isolated worktree, verification, and a human approval gate. Personal data and provider tokens stay on the local machine.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf8"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17211e" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#87938d"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="30" fill="url(#background)"/>
  <text x="70" y="75" fill="#17211e" font-family="Arial, sans-serif" font-size="31" font-weight="700">Orbit keeps autonomous work under human control</text>
  <text x="70" y="108" fill="#637069" font-family="Arial, sans-serif" font-size="17">Local-first by default: code and credentials stay on the Mac running Orbit.</text>
  <g fill="none" stroke="#87938d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M282 258H338"/>
    <path d="M518 258H574"/>
    <path d="M754 258H810"/>
    <path d="M990 258H1046"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="185" width="212" height="146" rx="20" fill="#ffffff" stroke="#dfe5df"/>
    <rect x="338" y="185" width="180" height="146" rx="20" fill="#f0edff" stroke="#d9d2ff"/>
    <rect x="574" y="185" width="180" height="146" rx="20" fill="#e7f7f0" stroke="#cdebdc"/>
    <rect x="810" y="185" width="180" height="146" rx="20" fill="#fff2ed" stroke="#f9d8ca"/>
    <rect x="1046" y="185" width="104" height="146" rx="20" fill="#ffffff" stroke="#dfe5df"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="176" y="230" fill="#5a6660" font-size="13" font-weight="700">REQUEST</text>
    <text x="176" y="260" fill="#17211e" font-size="18" font-weight="700">Orbit routes</text>
    <text x="176" y="285" fill="#637069" font-size="14">model + skill</text>
    <text x="428" y="230" fill="#6857bd" font-size="13" font-weight="700">ISOLATION</text>
    <text x="428" y="260" fill="#17211e" font-size="18" font-weight="700">Worktree</text>
    <text x="428" y="285" fill="#637069" font-size="14">never main</text>
    <text x="664" y="230" fill="#2f8763" font-size="13" font-weight="700">VERIFY</text>
    <text x="664" y="260" fill="#17211e" font-size="18" font-weight="700">Build + QA</text>
    <text x="664" y="285" fill="#637069" font-size="14">evidence first</text>
    <text x="900" y="230" fill="#be653e" font-size="13" font-weight="700">REVIEW</text>
    <text x="900" y="260" fill="#17211e" font-size="18" font-weight="700">Your inbox</text>
    <text x="900" y="285" fill="#637069" font-size="14">approve or discard</text>
    <text x="1098" y="246" fill="#52635a" font-size="13" font-weight="700">MERGE</text>
    <text x="1098" y="274" fill="#17211e" font-size="15" font-weight="700">only you</text>
  </g>
  <rect x="70" y="380" width="1080" height="52" rx="14" fill="#17211e"/>
  <text x="610" y="413" fill="#f8faf8" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Local profile · repository paths · skills · run history · API tokens remain on your machine</text>
</svg>
