name: Verify Orbit Community

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run security:check
      # `npm test` builds the client and starts an empty, isolated control
      # plane. It never uses a contributor's real local profile or credentials.
      # CI supplies Chromium explicitly so browser tests cannot be skipped.
      - run: |
          CHROME_BIN="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          test -x "$CHROME_BIN"
          export CHROME_BIN
          npm test
